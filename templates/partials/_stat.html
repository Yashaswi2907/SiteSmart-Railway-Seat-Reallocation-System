<div class="ss-card stat">
  <div class="stat-top"><span class="stat-label">{{ label }}</span><span class="stat-icon {{ tone }}"><i class="bi {{ icon }}" aria-hidden="true"></i></span></div>
  <div class="stat-value" {% if id %}id="{{ id }}"{% endif %}>{{ value }}</div>
  {% if foot %}<div class="stat-foot">{{ foot }}</div>{% endif %}
</div>
