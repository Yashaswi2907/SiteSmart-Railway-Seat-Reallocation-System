{% extends "layouts/public.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="error-page">
  <div>
    <div class="error-code">{{ code }}</div>
    <h1 class="h3 mt-3">{{ heading }}</h1>
    <p class="text-muted mx-auto" style="max-width: 440px;">{{ text }}</p>
    <div class="d-flex gap-2 justify-content-center">
      <a class="btn btn-primary" href="{% url 'core:home' %}"><i class="bi bi-house"></i> Home</a>
      {% if user.is_authenticated %}<a class="btn btn-light" href="{% url 'core:post_login' %}">My dashboard</a>{% else %}<a class="btn btn-light" href="{% url 'accounts:login' %}">Sign in</a>{% endif %}
    </div>
  </div>
</section>
{% endblock %}
